version: "3.8"

services:
  # Cloudflare Worker backend (via wrangler dev / miniflare)
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    ports:
      - "8787:8787"
    volumes:
      - worker-data:/app/.wrangler
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_SENDER=${SENDGRID_SENDER:-noreply <noreply@example.com>}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Frontend (nginx serving built static files)
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  worker-data:
